#完全不需要写仓库名
#✅ 自动就是“当前这个项目”
#✅ 永远拿最新 Release



name: Get My Repo Latest Release

on:
  workflow_dispatch:

jobs:
  get-release:
    runs-on: ubuntu-latest

    steps:
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Download latest release of this repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Current repo: $GITHUB_REPOSITORY"

          release_info=$(gh api repos/$GITHUB_REPOSITORY/releases/latest)
          tag_name=$(echo "$release_info" | jq -r .tag_name)

          echo "Latest tag: $tag_name"

          mkdir release-assets
          cd release-assets

          echo "$release_info" \
            | jq -r '.assets[].browser_download_url' \
            | while read url; do
                echo "Downloading $url"
                wget -q "$url"
              done
