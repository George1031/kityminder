name: Get Latest Release Or Tag

on:
  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Detect latest Release or Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Current repo: $GITHUB_REPOSITORY"

          # 1️⃣ 尝试获取最新 Release
          release_json=$(curl -s -o release.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest)

          if [ "$release_json" = "200" ]; then
            echo "✅ Release found"
            tag_name=$(jq -r '.tag_name' release.json)
            source="release"
          else
            echo "⚠️ No Release found, fallback to tag"

            tag_name=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/tags \
              | jq -r '.[0].name')

            if [ "$tag_name" = "null" ] || [ -z "$tag_name" ]; then
              echo "❌ No tag found"
              exit 1
            fi

            source="tag"
          fi

          echo "----------------------------"
          echo "Version source : $source"
          echo "Version tag    : $tag_name"
          echo "----------------------------"
